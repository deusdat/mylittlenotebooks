name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install the ObjectBox native library
        # objectbox_flutter_libs covers apps, not the Dart VM that runs tests.
        # Without this, every test fails at load with a dlopen error — which
        # reads as a broken suite rather than a missing setup step.
        #
        # Fetched from the tag matching the pinned objectbox version, NOT from
        # main: the script on main hardcodes cLibVersion=6.0.0-beta, which pairs
        # a newer C library with our 5.3.2 Dart bindings. The script's own
        # header warns that a mismatch produces obscure memory bugs rather than
        # an error. The version is read from pubspec.yaml so this cannot drift.
        run: |
          version=$(grep -E '^\s+objectbox:' pubspec.yaml | head -1 \
            | sed -E 's/.*\^?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          curl -sL "https://raw.githubusercontent.com/objectbox/objectbox-dart/v${version}/install.sh" -o install.sh
          bash install.sh
      - name: Generate ObjectBox bindings
        # `lib/objectbox.g.dart` is gitignored (pure generated Dart), so a clean
        # checkout must build it from the committed model before analyze/test.
        # `lib/objectbox-model.json` is committed and is what makes this stable.
        run: dart run build_runner build
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Verify the model is committed and current
        # The schema registry MUST be tracked (docs/data-conventions.md); the
        # generated Dart must NOT be. Regeneration has already run above, so a
        # stale model fails here rather than shipping silently.
        run: |
          git ls-files --error-unmatch lib/objectbox-model.json
          if git ls-files --error-unmatch lib/objectbox.g.dart >/dev/null 2>&1; then
            echo "lib/objectbox.g.dart must not be tracked (it is gitignored)"; exit 1
          fi
          git diff --exit-code -- lib/objectbox-model.json
      - name: Verify the dependency pins
        # build_runner's upper bound is load-bearing: objectbox_generator caps
        # analyzer below what build_runner >=2.15.2 requires, so a caret range
        # would fail the solver (docs/data-conventions.md).
        run: |
          grep -q 'build_runner: ">=2.12.0 <2.15.2"' pubspec.yaml
          grep -q 'objectbox: ^5.3.2' pubspec.yaml
          grep -q 'objectbox_generator: ^5.3.2' pubspec.yaml
          grep -q 'objectbox_flutter_libs: ^5.3.2' pubspec.yaml

  build-desktop:
    name: Build ${{ matrix.target }}
    # AC20 requires the shell to build and run on all three desktop targets.
    # This job is the actual verification for Windows and Linux, which cannot be
    # built on a single developer machine. It now also proves the ObjectBox
    # native library links on each of them (spec NFR1).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: windows-latest, target: windows }
          - { os: ubuntu-latest, target: linux }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build \
            libgtk-3-dev pkg-config liblzma-dev

      - name: Generate ObjectBox bindings
        # `lib/objectbox.g.dart` is gitignored, so every build target must
        # generate it from the committed model first. `dart run` rather than
        # `make`, because this job also runs on Windows.
        run: dart run build_runner build

      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }} --debug

      - name: Verify the generated Dart is not tracked
        # The inverse guard for this job: the model is committed, the generated
        # Dart is not. Accidentally committing the Dart is the mistake that
        # later makes a stale schema look current.
        run: |
          git ls-files --error-unmatch lib/objectbox-model.json
          if git ls-files --error-unmatch lib/objectbox.g.dart >/dev/null 2>&1; then
            echo "lib/objectbox.g.dart must not be tracked (it is gitignored)"; exit 1
          fi
